# Authoritative simulation geometry. Origin is the southwest outer corner;
# +X is east and +Y is north. Segment endpoints are in grid units.
grid: {rows: 4, cols: 6, spacing: 0.6, origin_x: 0.0, origin_y: 0.0}
wall: {height: 0.30, thickness: 0.01}
outer_segments:
  - [[0, 4], [6, 4]] # north
  - [[0, 0], [6, 0]] # south
  - [[0, 0], [0, 4]] # west
  - [[6, 0], [6, 4]] # east
internal_vertical:
  - [[1, 2], [1, 3]] # V1
  - [[2, 1], [2, 2]] # V2
  - [[3, 2], [3, 3]] # V3
  - [[4, 2], [4, 3]] # V4
  - [[5, 2], [5, 3]] # V5
internal_horizontal:
  - [[1, 3], [2, 3]] # H1
  - [[1, 2], [2, 2]] # H2
  - [[1, 1], [2, 1]] # H3
  - [[3, 2], [4, 2]] # H4
  - [[3, 1], [5, 1]] # H5
  - [[4, 3], [5, 3]] # H6
