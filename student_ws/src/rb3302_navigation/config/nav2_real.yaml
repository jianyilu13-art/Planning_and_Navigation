amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.2   # Rotation error caused by rotation
    alpha2: 0.2   # Rotation error caused by translation
    alpha3: 0.2   # Translation error caused by translation
    alpha4: 0.2   # Translation error caused by rotation
    alpha5: 0.2   # Extra motion noise for omni models; unused by differential model

    update_min_d: 0.05  # Update after 5 cm translation
    update_min_a: 0.05  # Update after ~2.9° rotation

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator

controller_server:
  ros__parameters:
    use_sim_time: false          # Use Gazebo time when true
    controller_frequency: 20.0  # Controller updates per second

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker  # Check if robot is making progress

    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker      # Check if robot reached the goal

    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController

      # ===== Forward Movement =====
      desired_linear_vel: 0.2                # Desired forward speed (m/s)

      # ===== Path Following =====
      lookahead_dist: 0.6                    # Fixed lookahead distance (m)
      min_lookahead_dist: 0.3                # Minimum adaptive lookahead (m)
      max_lookahead_dist: 0.9                # Maximum adaptive lookahead (m)
      lookahead_time: 1.5                    # Time used for adaptive lookahead (s)
      use_velocity_scaled_lookahead_dist: false  # false = use fixed lookahead_dist

      # ===== Turning =====
      rotate_to_heading_angular_vel: 0.3     # In-place turning speed (rad/s)
      use_rotate_to_heading: true            # Allow rotation to align with heading
      rotate_to_heading_min_angle: 0.785     # Heading error threshold (~45°)
      max_angular_accel: 0.8                 # Angular acceleration limit (rad/s²)
      allow_reversing: false                 # Do not follow paths backward

      # ===== Goal Approach =====
      min_approach_linear_velocity: 0.05     # Minimum approach speed (m/s)
      approach_velocity_scaling_dist: 0.6    # Slow down near path end (m)

      # ===== Collision Avoidance =====
      use_collision_detection: true         # Check predicted path for collisions
      max_allowed_time_to_collision_up_to_carrot: 1.0  # Collision prediction horizon (s)

      # ===== Speed Regulation =====
      use_regulated_linear_velocity_scaling: true  # Slow down on sharp curves
      use_cost_regulated_linear_velocity_scaling: false  # Disable cost-based slowdown
      regulated_linear_scaling_min_radius: 0.9  # Turn radius below which speed is reduced (m)
      regulated_linear_scaling_min_speed: 0.05  # Minimum regulated forward speed (m/s)

      # ===== TF =====
      transform_tolerance: 0.1              # TF lookup tolerance (s)

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[-0.095, -0.085], [0.095, -0.085], [0.095, 0.085], [-0.095, 0.085]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      footprint: "[[-0.095, -0.085], [0.095, -0.085], [0.095, 0.085], [-0.095, 0.085]]"
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      use_astar: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    max_velocity: [0.5, 0.0, 1.0]
    min_velocity: [-0.5, 0.0, -1.0]
    max_accel: [0.5, 0.0, 0.5]
    max_decel: [-0.5, 0.0, -0.5]
    odom_topic: /odom
    enable_stamped_cmd_vel: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
