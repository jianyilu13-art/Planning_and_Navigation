# Jazzy Nav2 configuration. Interfaces are the supplied Wave Rover stack: /scan,
# /odom (EKF from odom/raw + /imu_data_ros), base_link, odom, map and /cmd_vel.
amcl:
  ros__parameters:
    use_sim_time: false
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    scan_topic: /scan
    min_particles: 300
    max_particles: 1500
    update_min_d: 0.05
    update_min_a: 0.10
    transform_tolerance: 0.5
    laser_model_type: likelihood_field
    set_initial_pose: false
    always_reset_initial_pose: false
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    navigators: [navigate_to_pose]
    navigate_to_pose: {plugin: nav2_bt_navigator::NavigateToPoseNavigator}
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 15.0
    enable_stamped_cmd_vel: false
    odom_topic: /odom
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker: {plugin: nav2_controller::SimpleProgressChecker, required_movement_radius: 0.10, movement_time_allowance: 12.0}
    goal_checker: {plugin: nav2_controller::SimpleGoalChecker, xy_goal_tolerance: 0.12, yaw_goal_tolerance: 0.35, stateful: true}
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.22
      max_angular_accel: 1.5
      lookahead_dist: 0.35
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.55
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.3
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 8.0
      publish_frequency: 4.0
      rolling_window: true
      resolution: 0.05
      footprint: '[[0.15, 0.125], [0.15, -0.125], [-0.15, -0.125], [-0.15, 0.125]]'
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan: {topic: /scan, data_type: LaserScan, marking: true, clearing: true, obstacle_max_range: 2.5, raytrace_max_range: 3.0}
      inflation_layer: {plugin: nav2_costmap_2d::InflationLayer, inflation_radius: 0.30, cost_scaling_factor: 4.0}
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 2.0
      publish_frequency: 1.0
      resolution: 0.05
      track_unknown_space: true
      footprint: '[[0.15, 0.125], [0.15, -0.125], [-0.15, -0.125], [-0.15, 0.125]]'
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer: {plugin: nav2_costmap_2d::StaticLayer, map_subscribe_transient_local: true}
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan: {topic: /scan, data_type: LaserScan, marking: true, clearing: true, obstacle_max_range: 2.5, raytrace_max_range: 3.0}
      inflation_layer: {plugin: nav2_costmap_2d::InflationLayer, inflation_radius: 0.35, cost_scaling_factor: 4.0}
planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased: {plugin: nav2_navfn_planner::NavfnPlanner, tolerance: 0.12, use_astar: true, allow_unknown: false}
behavior_server:
  ros__parameters:
    global_frame: map
    local_frame: odom
    robot_base_frame: base_link
    odom_topic: /odom
    enable_stamped_cmd_vel: false
    behavior_plugins: [spin, backup, wait]
    spin: {plugin: nav2_behaviors::Spin}
    backup: {plugin: nav2_behaviors::BackUp}
    wait: {plugin: nav2_behaviors::Wait}
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    max_velocity: [0.22, 0.0, 1.0]
    min_velocity: [-0.10, 0.0, -1.0]
    max_accel: [0.35, 0.0, 1.5]
    max_decel: [-0.45, 0.0, -1.8]
    enable_stamped_cmd_vel: false
